<textarea>序

吉甫撰郡縣之志，未盡域中；景純注山海之經，空談荒外。良以地理之學難精，而滄溟之大，尤不易知也。五臺徐松龕中丞，博學多聞，兼綜條貫，嘗與論歴代典章制度，以及前言往行，無不元元本本，考核精詳。又以其餘釐正古書，鉤稽戎索，軼亥章之步，盡倏忽之疆，囊括鯤程，包舉鰲奠，著爲《瀛寰志略》若干卷。自東南海島諸國，西至蒲昌、鹿渾，北極伊連、渤鞮，其疆域之延袤，道里之遠近，創建因革之故，山川民物之名，前史所未詳，博物所不紀，靡不瞭如示掌，浩若吞胸。聽鄒衍之談天，小儒咋舌；覽木華之賦海，才士傾心。蓋公自觀察此邦，駐旌泉郡，值番舶通商之際，正譯書畢集之時，鰂醬魚鞞，圖披王會；象胥龍節，職在周官。固已訪塔影於酉陽，獲鱗書於丙穴，鱓更可數，犀照無遺。洎乎攄柔遠之藎忱，膺岩疆之重寄，三山甘雨，萬里恬波。既睹十郡之康，遂續九邱之志，寒暑再易，勒爲一編，洋洋乎宇宙之鉅觀，古今之絶業也。夫六合之外，聖人以不論存之；千歲之日，智者可坐而致之。故詢天之高廣，則仲尼、子貢不能知；極人之短長，則僬僥、防風可以決。豈非無徵者不信，多識者有功歟？

是書博采前賢著述，正其舛誤，得所折衷，帝虎魯魚，無訾後世，石華海月，廣掇前聞，洵堪備史館之參稽，恢職方之紀載者矣。公今宣力閩疆，渥承宸眷，勳猷所至，譽望日隆。方將黼黻球圖，焜煌鐘鼎，移海國見聞</textarea>
